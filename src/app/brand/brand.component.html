<div class="container mt-4 d-flex flex-column align-items-center">
  <!-- Toggle Buttons for Brand and Product Forms -->
  <div class="d-flex justify-content-between" role="group" >
    <button class="btn btn-warning" [class.active]="isBrandForm" (click)="toggleForm(true)">
      Add Brand
    </button>
    <button class="btn btn-info" [class.active]="!isBrandForm" (click)="toggleForm(false)">
      Add Product
    </button>
  </div>

  <!-- Form Card -->
  <div class="card shadow-sm p-3" style="max-width: 400px; width: 100%; border-radius: 8px;">
    <div class="card-header bg-success text-white text-center py-3">
      <h3 class="mb-0">{{ isBrandForm ? "Add New Brand" : "Add New Product" }}</h3>
    </div>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <!-- Shared Input for Brand/Product Name -->
      <div class="mb-2">
        <label for="name" class="form-label small">
          {{ isBrandForm ? "Brand Name" : "Product Name" }}
        </label>
        <input type="text" id="name" class="form-control form-control-sm" formControlName="name" />
        <div *ngIf="formGroup.get('name')?.invalid && formGroup.get('name')?.touched" class="text-danger small">
          Enter {{ isBrandForm ? "Brand" : "Product" }} name.
        </div>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="formGroup.invalid">
        Add {{ isBrandForm ? "Brand" : "Product" }}
      </button>
    </form>


    <!-- Table for Brand/Product Details -->
    <div class="container mt-4">
      <h1 class="text-center text-info">
        {{ isBrandForm ? "Brand Details" : "Product Details" }}
      </h1>
      <table class="table table-striped table-bordered">
        <thead class="table-success text-center">
          <tr>
            <th>Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody class="text-center">
          <tr *ngFor="let item of (isBrandForm ? brands : products)">
            <td>{{ item.name }}</td>
            <td>
              <button class="btn btn-sm btn-danger" (click)="isBrandForm ? deleteBrand(item) : deleteProduct(item)">
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
