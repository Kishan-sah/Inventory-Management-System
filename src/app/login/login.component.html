<div class="container d-flex justify-content-center align-items-center vh-100 bg-light">
  <div
    class="card shadow-lg p-0 d-flex flex-row overflow-hidden"
    style="width: 100%; max-width: 800px; border-radius: 16px; background: linear-gradient(135deg, #f8f9fa, #ffffff);"
  >
    <!-- Form Section -->
    <div class="p-5" style="flex: 1; background: white;">
      <h2 class="text-center mb-4 fw-bold" style="color: #2c3e50;">Welcome Back</h2>
      <p class="text-center text-muted mb-4">Login to continue to your account</p>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email Field -->
        <div class="mb-4">
          <label for="email" class="form-label fw-semibold" style="color: #34495e;">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            formControlName="email"
            placeholder="Enter your email"
          />
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger small">
            Please enter a valid email address.
          </div>
        </div>

        <!-- Password Field -->
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold" style="color: #34495e;">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            formControlName="password"
            placeholder="Enter your password"
          />
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger small">
            Password must be at least 6 characters.
          </div>
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          class="btn btn-primary w-100 fw-bold py-2"
          [disabled]="loginForm.invalid"
          style="background: #3498db; border: none; border-radius: 8px;"
        >
          Login
        </button>
      </form>

      <!-- Signup Button -->
      <div class="text-center mt-4">
        <p class="text-muted">Don't have an account?</p>
        <button
          class="btn btn-outline-primary w-100 fw-bold py-2"
          (click)="navigateToSignup()"
          style="border-radius: 8px; border: 2px solid #3498db;"
        >
          Sign Up
        </button>
      </div>
    </div>

    <!-- Image Section -->
    <div
      style="flex: 1; display: flex; justify-content: center; align-items: center; background: #f0f4f8;"
    >
      <img
        src="Login.png"
        alt="Login Icon"
        class="img-fluid shadow-lg"
        style="max-width: 90%; border-radius: 16px; transform: scale(1.05);"
      />
    </div>
  </div>
</div>
