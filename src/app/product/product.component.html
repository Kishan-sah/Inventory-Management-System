<div class="container mt-4 d-flex justify-content-center">
  <div class="card shadow-sm p-3" style="max-width: 400px; width: 100%; border-radius: 8px;">
    <h4 class="text-center mb-3">Add Brand</h4>
    <form [formGroup]="brandForm" (ngSubmit)="onSubmit()">
      <!-- Brand Name Input -->
      <div class="mb-2">
        <label for="brandName" class="form-label small">Brand Name</label>
        <input type="text" id="brandName" class="form-control form-control-sm" formControlName="brandName"/>
        <div *ngIf="brandForm.get('brandName')?.invalid && brandForm.get('brandName')?.touched" class="text-danger small">
          Enter Brand name.
        </div>
      </div>
      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary" [disabled]="brandForm.invalid">Add Brand</button>
    </form>

    <!-- Display Brand List -->
    <div class="container mt-4">
      <h1 class="text-center text-info">Brand Details</h1>

      <table class="table table-striped table-bordered">
        <thead class="table-success text-center">
          <tr>
            <th>Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody class="text-center">
          <tr *ngFor="let item of brands">
            <td>{{ item.brandName }}</td>
            <td>
              <button class="btn btn-sm btn-danger" (click)="deletebrand(item)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
