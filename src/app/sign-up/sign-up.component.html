<div class="container d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-lg p-0 d-flex flex-row" style="width: 100%; max-width: 800px; border-radius: 12px;">
    <!-- Form Section -->
    <div class="p-5" style="flex: 1; background: white;">
      <h2 class="text-center mb-4 fw-bold" style="color: #2c3e50;">Create Your Account</h2>
      <p class="text-center text-muted mb-4">Fill in the details to get started</p>

      <form [formGroup]="signupForm" (ngSubmit)="onSignup()">
        <!-- Full Name -->
        <div class="mb-4">
          <label for="name" class="form-label fw-semibold" style="color: #34495e;">Full Name</label>
          <input
            type="text"
            id="name"
            class="form-control"
            formControlName="name"
            placeholder="Enter your full name"
          />
          <div *ngIf="signupForm.get('name')?.invalid && signupForm.get('name')?.touched" class="text-danger small">
            Full name is required.
          </div>
        </div>

        <!-- Email -->
        <div class="mb-4">
          <label for="email" class="form-label fw-semibold" style="color: #34495e;">Email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            formControlName="email"
            placeholder="Enter your email"
          />
          <div *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched" class="text-danger small">
            A valid email is required.
          </div>
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold" style="color: #34495e;">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            formControlName="password"
            placeholder="Create a password"
          />
          <div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched" class="text-danger small">
            Password must be at least 6 characters.
          </div>
        </div>

        <!-- Role Selection -->
        <div class="mb-4">
          <label for="role" class="form-label fw-semibold" style="color: #34495e;">Role</label>
          <select id="role" class="form-select" formControlName="role">
            <option value="">Select a role</option>
            <option value="Admin">Admin</option>
            <option value="Manager">Manager</option>
            <option value="Customer">Customer</option>
          </select>
          <div *ngIf="signupForm.get('role')?.invalid && signupForm.get('role')?.touched" class="text-danger small">
            Role is required.
          </div>
        </div>

        <!-- Sign Up Button -->
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" [disabled]="signupForm.invalid" style="background: #3498db; border: none;">
          Sign Up
        </button>
      </form>

      <!-- Back to Login -->
      <div class="text-center mt-4">
        <p class="text-muted">Already have an account?</p>
        <button class="btn btn-outline-primary w-100 fw-bold" (click)="navigateToLogin()" style="border-radius: 8px; border: 2px solid #3498db;">
          Login
        </button>
      </div>
    </div>

    <!-- Image Section -->
    <div style="flex: 1; display: flex; justify-content: center; align-items: center;">
      <img src="Login.png" alt="Sign Up Icon" class="img-fluid" style="max-width: 80%; border-radius: 12px;" />
    </div>
  </div>
</div>
